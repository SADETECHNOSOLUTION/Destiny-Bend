spring.application.name=media-aggregate-service
server.port=8096

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Database Configuration
spring.datasource.url=jdbc:mysql://192.168.1.29:3306/media
spring.datasource.username=gokul
spring.datasource.password=Gokul@123
