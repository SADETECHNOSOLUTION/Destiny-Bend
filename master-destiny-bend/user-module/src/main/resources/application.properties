spring.application.name=user-module
server.port=8082

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/userprofile
spring.datasource.username=gokul
spring.datasource.password=Gokul@123
spring.jpa.hibernate.ddl-auto=update

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

#image
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/
file.upload-dir=/static/uploads

#Actuator Configuration
management.endpoints.web.exposure.include= *
management.endpoint.health.show-details=always
spring.boot.admin.client.url=http://localhost:8097
